name: Build Flos

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test core logic
        run: ./gradlew :core:test
      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: flos-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Windows installer and portable app
        shell: bash
        run: ./gradlew :desktop:packageMsi :desktop:createDistributable
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: flos-windows-installer
          path: desktop/build/compose/binaries/main/msi/*.msi
      - name: Upload portable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: flos-windows-portable
          path: desktop/build/compose/binaries/main/app/

  # Puts the newest app on the "Download" release page, so it can be installed on a phone with one tap:
  # https://github.com/<owner>/flos-pos/releases/latest/download/flos.apk
  release:
    name: Publish download
    needs: [ build, windows ]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect files
        run: |
          mkdir out
          cp dist/flos-apk/debug/*.apk out/flos.apk
          cp dist/flos-windows-installer/*.msi out/flos-windows.msi
          (cd dist/flos-windows-portable && zip -qr ../../out/flos-windows-portable.zip .)
          ls -la out
      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest out/* --target "$GITHUB_SHA" --latest \
            --title "Flos – nejnovější verze / latest build" \
            --notes "Android: stáhněte **flos.apk** v telefonu a otevřete ho (povolte instalaci z neznámých zdrojů). Windows: **flos-windows.msi**.
          Android: download **flos.apk** on the phone and open it (allow installing from unknown sources). Windows: **flos-windows.msi**.

          Build ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}."
