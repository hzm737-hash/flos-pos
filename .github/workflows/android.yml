name: Build Flos

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test core logic
        run: ./gradlew :core:test
      # The permanent signing key (repository secrets) lets every new flos.apk install as an update over the
      # old one without losing data. Without the secrets the build still works, signed with a random key.
      - name: Build APKs
        env:
          FLOS_UPLOAD_KEYSTORE_BASE64: ${{ secrets.FLOS_UPLOAD_KEYSTORE_BASE64 }}
          FLOS_UPLOAD_PASSWORD: ${{ secrets.FLOS_UPLOAD_PASSWORD }}
        run: |
          if [ -n "$FLOS_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$FLOS_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/flos-upload.p12"
            export FLOS_UPLOAD_KEYSTORE="$RUNNER_TEMP/flos-upload.p12"
            echo "Signing with the permanent Flos key"
          else
            echo "::warning::No FLOS_UPLOAD_KEYSTORE_BASE64 secret: APKs are signed with a random key and cannot update an installed Flos."
          fi
          ./gradlew :app:assembleDebug :app:assembleRelease
          rm -f "$RUNNER_TEMP/flos-upload.p12"
      # Pull requests keep the files for 3 days. A full artifact storage must not fail the build.
      - name: Upload APKs
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: flos-apk
          retention-days: 3
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
      # The newest app goes straight to the "latest" release (no artifact storage needed), so it can be
      # installed on a phone with one tap: https://github.com/<owner>/flos-pos/releases/latest/download/flos.apk
      - name: Publish flos.apk
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/*.apk flos.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --target "$GITHUB_SHA" --latest \
            --title "Flos – nejnovější verze / latest build" --notes "Flos" || true
          gh release upload latest flos.apk --clobber
          gh release edit latest --latest --title "Flos – nejnovější verze / latest build" \
            --notes "Android: stáhněte **flos.apk** v telefonu a otevřete ho (povolte instalaci z neznámých zdrojů). Windows: **flos-windows.msi**.
          Android: download **flos.apk** on the phone and open it (allow installing from unknown sources). Windows: **flos-windows.msi**.

          Build ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}."

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Windows installer and portable app
        shell: bash
        run: ./gradlew :desktop:packageMsi :desktop:createDistributable
      - name: Upload Windows installer
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: flos-windows-installer
          retention-days: 3
          path: desktop/build/compose/binaries/main/msi/*.msi
      - name: Publish Windows downloads
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          Copy-Item (Get-ChildItem desktop/build/compose/binaries/main/msi/*.msi | Select-Object -First 1).FullName flos-windows.msi
          Compress-Archive -Path desktop/build/compose/binaries/main/app/* -DestinationPath flos-windows-portable.zip
          gh release view latest *> $null
          if ($LASTEXITCODE -ne 0) { gh release create latest --target $env:GITHUB_SHA --latest --title "Flos" --notes "Flos"; $global:LASTEXITCODE = 0 }
          gh release upload latest flos-windows.msi flos-windows-portable.zip --clobber
