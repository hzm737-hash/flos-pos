name: Build Flos

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test core logic
        run: ./gradlew :core:test
      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: flos-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Windows installer and portable app
        shell: bash
        run: ./gradlew :desktop:packageMsi :desktop:createDistributable
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: flos-windows-installer
          path: desktop/build/compose/binaries/main/msi/*.msi
      - name: Upload portable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: flos-windows-portable
          path: desktop/build/compose/binaries/main/app/
