name: Google Play screenshots

# Run by hand (Actions → Google Play screenshots → Run workflow). Starts an Android emulator, opens Flos
# with its demo products and saves phone and tablet screenshots to the "play-assets" release.
on:
  workflow_dispatch:
  # Also when the screenshot script itself changes in a pull request.
  pull_request:
    paths:
      - .github/workflows/play-screenshots.yml
      - .github/scripts/play-screenshots.sh

jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build app
        run: ./gradlew :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/play-screenshots.sh
      - name: Publish screenshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd play-screenshots && zip -q ../flos-screenshots.zip *.png && cd ..
          gh release view play-assets >/dev/null 2>&1 || gh release create play-assets --target "$GITHUB_SHA" --latest=false \
            --title "Flos – Google Play obrázky" --notes "Snímky obrazovky pro Google Play (telefon a tablet)."
          gh release upload play-assets flos-screenshots.zip play-screenshots/*.png --clobber
